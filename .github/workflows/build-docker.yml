name: Build and Push Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'opend/Dockerfile'
      - 'requirements.txt'
      - 'app.py'
      - 'futu_client.py'
      - 'scheduler.py'
      - 'opend/entrypoint.sh'
      - 'opend/bootstrap-vnc.sh'
      - 'opend/render-config.sh'
      - '.github/workflows/build-docker.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          # Tracker image — Flask app (root Dockerfile).
          # Resulting tag: ghcr.io/er-epr/futu-tracker
          - image_name: futu-tracker
            context: .
          # OpenD gateway image — headless Futu OpenD (opend/Dockerfile).
          # Resulting tag: ghcr.io/er-epr/futu-opend
          - image_name: futu-opend
            context: ./opend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read Docker Image Identifiers
        # Lowercase the repo (ER-EPR/futu-tracker -> er-epr/futu-tracker) and
        # keep the namespace (er-epr) so we push under the user's own GHCR
        # library — not the registry root, which we lack permission for.
        # The trailing image name (futu-tracker / futu-opend) comes from the
        # matrix, decoupled from the repo name so opend isn't forced to
        # "futu-tracker-opend".
        run: |
          echo NAMESPACE=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]' | cut -d/ -f1) >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ env.NAMESPACE }}/${{ matrix.image_name }}:latest
            ghcr.io/${{ env.NAMESPACE }}/${{ matrix.image_name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Futu portfolio tracker — ${{ matrix.image_name }} image
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
