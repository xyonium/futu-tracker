services:
  opend:
    # Pre-built image from GHCR (pushed by .github/workflows/build-docker.yml).
    # No `build:` key — pulling avoids a local build on `docker compose up`.
    # To build locally instead, swap this for `build: ./opend`.
    image: ghcr.io/er-epr/futu-opend:latest
    container_name: futu-opend
    # Bound retry — 3 crashes = give up. Avoids the "登录次数过多" 45-min
    # rate limit that unbounded restart-on-crash triggers.
    restart: on-failure:3
    environment:
      # Required — your Futu / moomoo user ID (or phone / email).
      - FUTU_LOGIN_ACCOUNT=${FUTU_LOGIN_ACCOUNT:?FUTU_LOGIN_ACCOUNT must be set in .env}
      # Password MD5 for headless CLI restarts (generate: echo -n 'mypass' | md5sum).
      # VNC bootstrap is still needed once for the device fingerprint.
      - FUTU_LOGIN_PWD_MD5=${FUTU_LOGIN_PWD_MD5:-}
      - OPEND_VERSION=${OPEND_VERSION:-10.8.6808}
      - FUTU_LANG=${FUTU_LANG:-chs}
      - FUTU_LOG_LEVEL=${FUTU_LOG_LEVEL:-info}
      # Optional — if unset, a random 20-char password is generated once
      # and persisted to the opend-data volume. Read it from `docker logs opend`.
      - VNC_PASSWORD=${VNC_PASSWORD:-}
    volumes:
      - opend-data:/data
      - opend-config:/config
      # Shared RSA private key for encrypted API traffic. Futu proto
      # encryption is a shared-secret style scheme (both OpenD and every
      # SDK client load the same PKCS#1 1024-bit key), not asymmetric.
      # Auto-generated on first boot; copy the key block out of
      # `docker logs opend` and paste it into the tracker admin panel.
      - opend-rsa:/rsa
    ports:
      # Bootstrap-only. Once the fingerprint is captured, the entrypoint
      # pkills the websockify process and this port stops responding.
      - "${VNC_BIND:-0.0.0.0}:6080:6080"
    # 11111 is NOT published — tracker reaches OpenD over the internal
    # docker network on hostname "opend".
    expose:
      - "11111"
    networks:
      - futu-net

  tracker:
    # Pre-built image from GHCR (pushed by .github/workflows/build-docker.yml).
    # No `build:` key — pulling avoids a local build on `docker compose up`.
    # To build locally instead, swap this for `build: .`.
    image: ghcr.io/er-epr/futu-tracker:latest
    container_name: futu-tracker
    restart: unless-stopped
    depends_on:
      - opend
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-please-change-this-secret}
      # Overrides the futu_host/futu_port DB config on first run so the
      # tracker points at the sibling opend container automatically.
      - FUTU_HOST=opend
      - FUTU_PORT=11111
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    networks:
      - futu-net

volumes:
  opend-data:
  opend-config:
  opend-rsa:

networks:
  futu-net:
    driver: bridge
